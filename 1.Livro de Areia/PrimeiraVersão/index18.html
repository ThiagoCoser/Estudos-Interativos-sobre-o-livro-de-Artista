<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Areia - Códice de Silhueta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0908;
            color: #2c2519;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Alterado para acomodar o botão */
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Botão de calibração */
        #calibrate-btn {
            position: absolute;
            top: 20px;
            z-index: 100;
            padding: 10px 20px;
            background-color: #e3dec6;
            border: 2px solid #2c2519;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background 0.3s;
        }

        #calibrate-btn:hover {
            background-color: #c9c3a3;
        }

        #book-cover {
            position: absolute;
            z-index: 10;
            width: 400px;
            height: 550px;
            background-image: url('capa.png');
            background-size: cover;
            background-position: center;
            border-radius: 5px 20px 20px 5px;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.8), inset 5px 0 20px rgba(0, 0, 0, 0.5);
            border-left: 15px solid #2a1f18;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1), opacity 2s ease, filter 2s ease;
        }

        body.is-dissolving #book-cover {
            transform: scale(1.1) rotate(3deg) translateY(-20px);
            opacity: 0;
            filter: url(#sand-dissolve) blur(10px) contrast(150%);
            pointer-events: none;
        }

        #codex-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            perspective: 2500px;
            transition: opacity 2s ease;
        }

        body.is-open #codex-container {
            opacity: 1;
            pointer-events: auto;
        }

        #codex-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #e3dec6;
            border: 1px solid rgba(44, 37, 25, 0.2);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.6);
            display: grid;
            grid-template-columns: 1.5fr 2fr 1.2fr;
            padding: 3rem;
            gap: 2rem;
            box-sizing: border-box;
            transform-style: preserve-3d;
            transform-origin: center;
            align-items: center;
        }

        .turning-page {
            animation: turnPageAnim 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes turnPageAnim {
            0% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }

            45% {
                transform: rotateY(-90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            55% {
                transform: rotateY(90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
        }

        #main-text-block {
            font-family: 'Amiri', serif;
            color: #2c2519;
            font-size: 1rem;
            line-height: 1.7;
            text-align: justify;
            text-justify: inter-word;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5rem;
            background: rgba(44, 37, 25, 0.04);
            border-radius: 4px;
            border-left: 3px solid rgba(44, 37, 25, 0.3);
            overflow: hidden;
            box-sizing: border-box;
        }

        .marginalia-right {
            font-family: 'Amiri', serif;
            color: #2c2519;
            opacity: 0.8;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 0.5rem;
        }

        .side-block-horizontal {
            font-size: 0.85rem;
            line-height: 1.4;
            text-align: right;
            background: rgba(44, 37, 25, 0.03);
            padding: 0.8rem;
            border-radius: 3px;
        }

        .side-block-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.85rem;
            line-height: 1.4;
            text-align: justify;
            background: rgba(44, 37, 25, 0.03);
            padding: 0.8rem;
            border-radius: 3px;
            max-height: 45%;
        }

        .glyph-large {
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 0.7;
        }

        .glyph-rotated {
            display: inline-block;
            transform: rotate(-15deg);
        }

        .glyph-dropcap {
            float: left;
            font-size: 3.5rem;
            line-height: 0.6;
            padding-right: 8px;
            font-family: 'Cinzel', serif;
        }

        #sand-canvas {
            width: 100%;
            height: 85%;
            object-fit: cover;
            filter: url(#sand-distortion) contrast(1.1) sepia(0.5) brightness(0.9) blur(0.5px);
            border-radius: 8px;
        }

        #webcam-video {
            display: none;
        }
    </style>
</head>

<body>

    <svg style="display: none;">
        <filter id="sand-dissolve">
            <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="4" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="sand-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" id="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"
                id="displacement" />
        </filter>
    </svg>

    <!-- Botão de Calibração -->
    <button id="calibrate-btn">1. Saia do quadro e clique aqui para calibrar o fundo</button>

    <div id="book-cover"></div>

    <div id="codex-container">
        <div id="codex-page">
            <div id="main-text-block">
                <div id="content-text">Invocando os versos da biblioteca...</div>
            </div>

            <div
                style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
                <canvas id="sand-canvas"></canvas>
            </div>

            <div class="marginalia-right">
                <div class="side-block-horizontal" id="side-block-1"></div>
                <div class="side-block-vertical" id="side-block-2"></div>
            </div>
        </div>
    </div>

    <video id="webcam-video" autoplay playsinline></video>

    <script>
        const bookCover = document.getElementById('book-cover');
        const codexPage = document.getElementById('codex-page');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const calibrateBtn = document.getElementById('calibrate-btn');

        let width, height;
        let sandCharacters = "M IN H U A N Y A K U N A • ";
        let timeOffset = 0;

        const step = 14;
        let chaosFactor = 2.5;
        let isTurning = false;
        let isDissolving = false;

        let webImage = new Image();
        webImage.crossOrigin = "Anonymous";
        let isImageLoaded = false;

        // **NOVAS VARIÁVEIS PARA SEGMENTAÇÃO**
        let backgroundImageData = null; // Armazena os pixels do fundo de referência
        let segmentationThreshold = 35;  // Sensibilidade da diferença de cor (ajuste se necessário)
        let backgroundCaptured = false; // Flag para indicar se calibrou

        const bancoPoeticoDinamico = [
            "A poesia não começa em versos medidos, mas na areia movediça que consome os dias e apaga os rastros do espelho.",
            "As palavras deste livro desdobram-se como raízes noturnas, buscando o eco de um verso esquecido na biblioteca de Babel.",
            "O tempo constrói torres de silêncio e as desmorona em grãos finos que escorrem entre os dedos do leitor insone.",
            "Canta o labirinto invisível onde o caçador e a fera trocam de lugar sob a luz fria de astros mortos.",
            "Havia no centro da página uma respiração antiga, feita de versos truncados e metáforas que sangram poeira.",
            "Ergue-se a cidade dos espelhos rotativos, onde cada estrofe lida reflete um reflexo que nunca existiu no mundo real.",
            "O verso puro é aquele que sobrevive ao incêndio da memória e à erosão implacável das eras sem nome.",
            "Desfazem-se os mapas nas margens do poema; restam apenas as coordenadas do vento e o peso da sombra.",
            "Na aridez do compêndio, cada sílaba é um grão de areia que desafia o princípio e o fim do universo.",
            "O canto secreto dos poetas antigos ressoa nas fendas do pergaminho, onde o tempo perdeu a contagem dos dias."
        ];

        function resize() {
            if (!canvas.parentElement) return;
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // **FUNÇÃO DE CALIBRAÇÃO (CAPTURA O FUNDO)**
        calibrateBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Impede que o clique abra o livro acidentalmente
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(video, 0, 0, width, height);
                backgroundImageData = tempCtx.getImageData(0, 0, width, height).data;
                backgroundCaptured = true;
                calibrateBtn.innerText = "Fundo calibrado! Agora clique na capa para abrir.";
                calibrateBtn.style.backgroundColor = "#a3c9a3"; // Muda cor para indicar sucesso
            } else {
                alert("Aguarde a câmera carregar.");
            }
        });

        document.addEventListener('click', () => {
            // Só permite abrir o livro se calibrou o fundo
            if (!backgroundCaptured) {
                alert("Por favor, calibre o fundo primeiro (saia do quadro e clique no botão no topo).");
                return;
            }

            if (!document.body.classList.contains('is-open')) {
                if (!isDissolving) {
                    isDissolving = true;
                    document.body.classList.add('is-dissolving');
                    calibrateBtn.style.display = 'none'; // Esconde o botão ao abrir

                    setTimeout(() => {
                        bookCover.style.display = 'none';
                        document.body.classList.add('is-open');
                        initCamera();
                        updatePageContent();
                        setTimeout(renderSand, 2500);
                        isDissolving = false;
                    }, 1800);
                }
                return;
            }

            if (isTurning || isDissolving) return;
            turnPage();
        });

        function turnPage() {
            isTurning = true;
            codexPage.classList.add('turning-page');

            document.getElementById('turbulence').setAttribute('baseFrequency', '0.06');
            document.getElementById('displacement').setAttribute('scale', '15');

            setTimeout(() => {
                updatePageContent();
            }, 1500);

            setTimeout(() => {
                codexPage.classList.remove('turning-page');
                document.getElementById('turbulence').setAttribute('baseFrequency', '0.04');
                document.getElementById('displacement').setAttribute('scale', '8');
                isTurning = false;
            }, 3000);
        }

        async function initCamera() {
            try {
                // Tenta acessar a câmera. Nota: Se clicar calibrar antes, stream já existe.
                if (!video.srcObject) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                }
            } catch (err) {
                console.error("Erro na câmera: ", err);
            }
        }
        // Inicia a câmera imediatamente para permitir calibração
        initCamera();

        function generateTruncatedTypography(text, useDropCap = false) {
            let result = '';
            const glifosExtras = " ℵ ℞ منْهُ أَنْ ~ § · × ÷ ";

            if (useDropCap && text.length > 0) {
                result += `<span class="glyph-dropcap">${text[0]}</span>`;
                text = text.substring(1);
            }

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                const rand = Math.random();

                if (rand > 0.94) {
                    result += `<span class="glyph-large">${char}</span>`;
                } else if (rand > 0.88) {
                    result += `<span class="glyph-rotated">${char}</span>`;
                } else if (rand > 0.83) {
                    const glifeAleatorio = glifosExtras[Math.floor(Math.random() * glifosExtras.length)];
                    result += `<span style="font-family:'Amiri'; opacity:0.6;">${glifeAleatorio}</span>${char}`;
                } else {
                    result += char;
                }
            }
            return result;
        }

        function updatePageContent() {
            let indices = [];
            while (indices.length < 4) {
                let r = Math.floor(Math.random() * bancoPoeticoDinamico.length);
                if (!indices.includes(r)) indices.push(r);
            }

            const textoPrincipal = bancoPoeticoDinamico[indices[0]];
            const textoLateral1 = bancoPoeticoDinamico[indices[1]];
            const textoLateral2 = bancoPoeticoDinamico[indices[2]];

            const textoWebcam = bancoPoeticoDinamico[indices[3]];
            sandCharacters = textoWebcam.toUpperCase() + " • ";

            document.getElementById('content-text').innerHTML = generateTruncatedTypography(textoPrincipal, true);
            document.getElementById('side-block-1').innerHTML = generateTruncatedTypography(textoLateral1, false);
            document.getElementById('side-block-2').innerHTML = generateTruncatedTypography(textoLateral2, false);

            isImageLoaded = false;
            webImage.src = `https://picsum.photos/${Math.floor(width)}/${Math.floor(height)}?random=${Date.now()}&grayscale`;
            webImage.onload = () => {
                isImageLoaded = true;
            };
        }

        function renderSand() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && backgroundCaptured) {
                ctx.clearRect(0, 0, width, height);

                if (isImageLoaded) {
                    ctx.globalAlpha = 0.1; // Sutilmente mais claro o fundo
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(webImage, 0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                // Cria canvas temporário para ler o frame ATUAL da webcam
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                tempCtx.translate(width, 0); // Espelha o vídeo atual também
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, width, height);

                const currentImageData = tempCtx.getImageData(0, 0, width, height).data;

                ctx.font = "14px Amiri";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                timeOffset += 0.2;
                const cols = Math.floor(width / step);

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const pixelIndex = (y * width + x) * 4;

                        // **LÓGICA DE SUBTRAÇÃO DE FUNDO**
                        // Cores do frame atual
                        const cr = currentImageData[pixelIndex];
                        const cg = currentImageData[pixelIndex + 1];
                        const cb = currentImageData[pixelIndex + 2];

                        // Cores do fundo calibrado
                        const br = backgroundImageData[pixelIndex];
                        const bg = backgroundImageData[pixelIndex + 1];
                        const bb = backgroundImageData[pixelIndex + 2];

                        // Calcula a diferença absoluta de cor (distância Euclidiana simplificada)
                        const diff = Math.sqrt(
                            Math.pow(cr - br, 2) +
                            Math.pow(cg - bg, 2) +
                            Math.pow(cb - bb, 2)
                        );

                        // **SÓ DESENHA SE A DIFERENÇA FOR MAIOR QUE O LIMIAR (É PESSOA)**
                        if (diff > segmentationThreshold) {

                            // Lógica de seleção do caractere sequencial (Mapeamento em grade)
                            const col = Math.floor(x / step);
                            const row = Math.floor(y / step);
                            const linearGridIndex = Math.floor(row * cols + col + timeOffset);

                            const charIndex = linearGridIndex % sandCharacters.length;
                            const character = sandCharacters[charIndex];

                            const baseChaos = 0.5;
                            const noiseX = Math.sin(y * 0.1 + timeOffset * 0.1) * baseChaos;
                            const noiseY = Math.cos(x * 0.1 + timeOffset * 0.1) * baseChaos;

                            // Alpha fixo ou baseado na luminosidade do pixel original da pessoa
                            const alpha = 0.7; // Mantém legível
                            ctx.fillStyle = `rgba(30, 25, 15, ${alpha})`;

                            ctx.fillText(character, x + noiseX, y + noiseY);
                        }
                    }
                }
            }
            requestAnimationFrame(renderSand);
        }
    </script>
</body>

</html>
