<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Areia - Interativo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0908;
            color: #2c2519;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ESTADO 1: A Capa do Livro (Imagem Antiga) */
        #book-cover {
            position: absolute;
            z-index: 10;
            width: 400px;
            height: 550px;
            cursor: pointer;
            transition: opacity 1.5s ease, transform 2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Usando uma imagem de livro antigo de domínio público como textura */
            background-image: url('https://images.unsplash.com/photo-1544816155-12df9643f363?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-radius: 5px 20px 20px 5px;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.8), inset 5px 0 20px rgba(0, 0, 0, 0.5);
            border-left: 15px solid #2a1f18;
            /* Lombada */
        }

        #book-cover h1 {
            color: #e3dec6;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
            font-size: 2.5rem;
            text-align: center;
            padding: 0 20px;
        }

        #book-cover p {
            color: #e3dec6;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 5px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* ESTADO 2: O Códice Aberto */
        #codex-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease 1s;
            perspective: 1500px;
            /* Necessário para o efeito 3D de virar página */
        }

        body.is-open #book-cover {
            opacity: 0;
            transform: scale(1.2) rotateY(-90deg);
            /* Abre como uma capa real */
            pointer-events: none;
        }

        body.is-open #codex-container {
            opacity: 1;
            pointer-events: auto;
        }

        #codex-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #e3dec6;
            border: 1px solid rgba(44, 37, 25, 0.2);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.6);
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            padding: 2rem;
            box-sizing: border-box;
            transform-style: preserve-3d;
            transform-origin: center left;
        }

        /* Animação de virar a página */
        .turning-page {
            animation: turnPageAnim 1.5s ease-in-out forwards;
        }

        @keyframes turnPageAnim {
            0% {
                transform: rotateY(0deg);
                opacity: 1;
                filter: brightness(1);
            }

            49% {
                transform: rotateY(-90deg) scale(0.95);
                opacity: 0.2;
                filter: brightness(2);
            }

            50% {
                transform: rotateY(90deg) scale(0.95);
                opacity: 0;
            }

            100% {
                transform: rotateY(0deg);
                opacity: 1;
                filter: brightness(1);
            }
        }

        /* Elementos da Diagramação */
        .marginalia {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            line-height: 1.8;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            opacity: 0.6;
            word-wrap: break-word;
            overflow: hidden;
            text-align: justify;
        }

        #sand-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Aplicando o filtro SVG de distorção (Areia) + Ajuste de cor */
            filter: url(#sand-distortion) contrast(1.1) sepia(0.5) brightness(0.9);
        }

        /* Botão de Interação */
        #next-page-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            background: transparent;
            color: #2c2519;
            border: 1px solid #2c2519;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }

        #next-page-btn:hover {
            background: #2c2519;
            color: #e3dec6;
        }

        #webcam-video {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Filtro SVG: Cria a textura de areia em movimento/dissolução -->
    <svg style="display: none;">
        <filter id="sand-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" id="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"
                id="displacement" />
        </filter>
    </svg>

    <!-- ESTADO 1: A Capa -->
    <div id="book-cover">
        <h1>O Livro<br>de Areia</h1>
        <p>Abrir</p>
    </div>

    <!-- ESTADO 2: O Miolo -->
    <div id="codex-container">
        <div id="codex-page">
            <div class="marginalia" id="margin-left"></div>
            <canvas id="sand-canvas"></canvas>
            <div class="marginalia" id="margin-right"></div>
        </div>
        <button id="next-page-btn">Virar Página</button>
    </div>

    <video id="webcam-video" autoplay playsinline></video>

    <script>
        const cover = document.getElementById('book-cover');
        const codexPage = document.getElementById('codex-page');
        const nextBtn = document.getElementById('next-page-btn');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width, height;
        let sandCharacters = "مِنْهُأَنْيَكُونَأَوْلَكِنَّهُمَكَانَ";
        let timeOffset = 0;
        const step = 14;

        // Fator de caos (Aumenta quando a página é virada para dissolver o texto)
        let chaosFactor = 1.5;

        let webImage = new Image();
        webImage.crossOrigin = "Anonymous";
        let isImageLoaded = false;

        function resize() {
            if (!canvas.parentElement) return;
            width = canvas.parentElement.clientWidth / 2;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- INTERAÇÕES FÍSICAS ---

        // 1. Abrir o livro
        cover.addEventListener('click', () => {
            document.body.classList.add('is-open');
            initCamera();
            fetchLiveDust();
            fetchWebImage();
            setTimeout(renderSand, 1500);
        });

        // 2. Virar a página manualmente
        nextBtn.addEventListener('click', () => {
            // Adiciona classe CSS que faz o flip 3D
            codexPage.classList.add('turning-page');

            // Cria a tempestade de areia (aumenta o ruído das partículas)
            chaosFactor = 50;

            // Altera a frequência do filtro SVG para dar um aspecto agressivo de dissolução
            document.getElementById('turbulence').setAttribute('baseFrequency', '0.1');
            document.getElementById('displacement').setAttribute('scale', '30');

            // No meio da animação (quando o "papel" está de lado), trocamos os dados
            setTimeout(() => {
                fetchLiveDust();
                fetchWebImage();
            }, 750); // Metade do tempo da animação CSS (1.5s)

            // Quando a animação termina, estabiliza a areia e remove a classe
            setTimeout(() => {
                codexPage.classList.remove('turning-page');
                chaosFactor = 1.5; // Restaura a coesão da areia
                document.getElementById('turbulence').setAttribute('baseFrequency', '0.04');
                document.getElementById('displacement').setAttribute('scale', '8');
            }, 1500);
        });

        // --- SISTEMAS DE DADOS EXTERNOS ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Erro na câmera: ", err);
            }
        }

        async function fetchLiveDust() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/' + Math.floor(Math.random() * 100 + 1));
                const data = await response.json();
                let rawText = data.body.replace(/\s+/g, '').toUpperCase();
                sandCharacters = rawText + "مِنْهُأَنْيَكُونَ∞";

                document.getElementById('margin-left').innerText = sandCharacters.substring(0, 150);
                document.getElementById('margin-right').innerText = sandCharacters.substring(150, 300);
            } catch (err) {
                console.log("Erro ao buscar texto.");
            }
        }

        function fetchWebImage() {
            isImageLoaded = false;
            webImage.src = `https://picsum.photos/${Math.floor(width)}/${Math.floor(height)}?random=${new Date().getTime()}&grayscale`;
            webImage.onload = () => {
                isImageLoaded = true;
            };
        }

        // --- MOTOR GRÁFICO (RENDERIZAÇÃO) ---
        function renderSand() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {

                ctx.clearRect(0, 0, width, height);

                // Desenha a imagem de fundo (Memória apagada)
                if (isImageLoaded) {
                    ctx.globalAlpha = 0.2;
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(webImage, 0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                // Processa a Webcam
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                tempCtx.translate(width, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, width, height);

                const imageData = tempCtx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                ctx.font = "14px Amiri";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                timeOffset += 0.05;

                // Desenha a Areia
                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const index = (y * width + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];

                        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                        if (brightness < 180) {
                            const charIndex = Math.floor((x + y + timeOffset * 10) % sandCharacters.length);
                            const character = sandCharacters[charIndex];

                            // Aqui o chaosFactor entra em ação. Quando viramos a página, o ruído explode.
                            const noiseX = Math.sin(y * 0.1 + timeOffset) * chaosFactor;
                            const noiseY = Math.cos(x * 0.1 + timeOffset) * chaosFactor;

                            const alpha = 1 - (brightness / 180);
                            ctx.fillStyle = `rgba(30, 25, 15, ${alpha + 0.3})`;

                            ctx.fillText(character, x + noiseX, y + noiseY);
                        }
                    }
                }
            }
            requestAnimationFrame(renderSand);
        }
    </script>
</body>

</html>
