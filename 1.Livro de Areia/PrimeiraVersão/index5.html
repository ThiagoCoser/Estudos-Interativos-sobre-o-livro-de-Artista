<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Areia - Infinito Suave</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0908;
            color: #2c2519;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            /* Indica que toda a tela é interativa */
        }

        /* ESTADO 1: A Capa do Livro (Imagem Local) */
        #book-cover {
            position: absolute;
            z-index: 10;
            width: 400px;
            height: 550px;
            /* Transição muito mais longa e suave ao abrir */
            transition: opacity 2.5s ease, transform 3s cubic-bezier(0.25, 1, 0.5, 1);
            background-image: url('capa.png');
            /* Sua imagem local */
            background-size: cover;
            background-position: center;
            border-radius: 5px 20px 20px 5px;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.8), inset 5px 0 20px rgba(0, 0, 0, 0.5);
            border-left: 15px solid #2a1f18;
        }

        /* ESTADO 2: O Códice Aberto */
        #codex-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            /* Aumentamos a perspectiva para o 3D ficar menos distorcido e mais natural */
            perspective: 2500px;
            transition: opacity 3s ease 1.5s;
        }

        /* O Momento da Abertura */
        body.is-open #book-cover {
            opacity: 0;
            /* A capa rotaciona simulando a abertura para a esquerda */
            transform: scale(1.1) rotateY(-110deg);
        }

        body.is-open #codex-container {
            opacity: 1;
            pointer-events: auto;
        }

        #codex-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #e3dec6;
            border: 1px solid rgba(44, 37, 25, 0.2);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.6);
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            padding: 2rem;
            box-sizing: border-box;
            transform-style: preserve-3d;
            transform-origin: center;
        }

        /* Animação Suave de Virar a Página */
        .turning-page {
            animation: turnPageAnim 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes turnPageAnim {
            0% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }

            45% {
                transform: rotateY(-90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            55% {
                transform: rotateY(90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
        }

        /* Elementos da Diagramação */
        .marginalia {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            line-height: 1.8;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            opacity: 0.6;
            word-wrap: break-word;
            overflow: hidden;
            text-align: justify;
        }

        #sand-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Adicionando um leve blur base para fundir melhor a areia */
            filter: url(#sand-distortion) contrast(1.1) sepia(0.5) brightness(0.9) blur(0.5px);
        }

        #webcam-video {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Filtro SVG: Textura de Areia -->
    <svg style="display: none;">
        <filter id="sand-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" id="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"
                id="displacement" />
        </filter>
    </svg>

    <!-- ESTADO 1: A Capa (Sem Textos) -->
    <div id="book-cover"></div>

    <!-- ESTADO 2: O Miolo -->
    <div id="codex-container">
        <div id="codex-page">
            <div class="marginalia" id="margin-left"></div>
            <canvas id="sand-canvas"></canvas>
            <div class="marginalia" id="margin-right"></div>
        </div>
    </div>

    <video id="webcam-video" autoplay playsinline></video>

    <script>
        const codexPage = document.getElementById('codex-page');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width, height;
        let sandCharacters = "مِنْهُأَنْيَكُونَأَوْلَكِنَّهُمَكَانَ";
        let timeOffset = 0;
        const step = 14;

        let chaosFactor = 1.5;
        let isTurning = false;

        let webImage = new Image();
        webImage.crossOrigin = "Anonymous";
        let isImageLoaded = false;

        function resize() {
            if (!canvas.parentElement) return;
            width = canvas.parentElement.clientWidth / 2;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. Controle de Clique Global (Para Abrir e Virar Páginas)
        document.body.addEventListener('click', () => {

            // Se o livro está fechado, nós o abrimos
            if (!document.body.classList.contains('is-open')) {
                document.body.classList.add('is-open');
                initCamera();
                fetchLiveDust();
                fetchWebImage();
                // Aguarda 2.5s (o tempo do fade in da capa) para iniciar o motor da areia
                setTimeout(renderSand, 2500);
                return;
            }

            // Se já está aberto e uma página está virando, ignora o clique para não encavalar
            if (isTurning) return;

            // Se o livro está aberto e estável, vira a página
            turnPage();
        });

        // 2. A Coreografia de Virar a Página Suavemente
        function turnPage() {
            isTurning = true;
            codexPage.classList.add('turning-page');

            // Aumenta o caos sutilmente (espalha a areia sem agressividade)
            chaosFactor = 15;
            document.getElementById('turbulence').setAttribute('baseFrequency', '0.06');
            document.getElementById('displacement').setAttribute('scale', '15');

            // No meio exato da animação (1.5s), quando a página está invisível, trocamos os dados
            setTimeout(() => {
                fetchLiveDust();
                fetchWebImage();
            }, 1500);

            // Final da transição (3s), estabiliza a areia da nova página
            setTimeout(() => {
                codexPage.classList.remove('turning-page');
                chaosFactor = 1.5;
                document.getElementById('turbulence').setAttribute('baseFrequency', '0.04');
                document.getElementById('displacement').setAttribute('scale', '8');
                isTurning = false; // Libera para o próximo clique
            }, 3000);
        }

        // --- SISTEMAS DE DADOS EXTERNOS ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Erro na câmera: ", err);
            }
        }

        async function fetchLiveDust() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/' + Math.floor(Math.random() * 100 + 1));
                const data = await response.json();
                let rawText = data.body.replace(/\s+/g, '').toUpperCase();
                sandCharacters = rawText + "مِنْهُأَنْيَكُونَ∞";

                document.getElementById('margin-left').innerText = sandCharacters.substring(0, 150);
                document.getElementById('margin-right').innerText = sandCharacters.substring(150, 300);
            } catch (err) {
                console.log("Mantendo texto base.");
            }
        }

        function fetchWebImage() {
            isImageLoaded = false;
            webImage.src = `https://picsum.photos/${Math.floor(width)}/${Math.floor(height)}?random=${new Date().getTime()}&grayscale`;
            webImage.onload = () => {
                isImageLoaded = true;
            };
        }

        // --- MOTOR GRÁFICO ---
        function renderSand() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.clearRect(0, 0, width, height);

                // Desenha a "memória" no fundo
                if (isImageLoaded) {
                    ctx.globalAlpha = 0.15; // Deixei um pouco mais transparente para focar no seu rosto
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(webImage, 0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                // Processa a Webcam
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                tempCtx.translate(width, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, width, height);

                const imageData = tempCtx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                ctx.font = "14px Amiri";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                timeOffset += 0.05;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const index = (y * width + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];

                        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                        if (brightness < 180) {
                            const charIndex = Math.floor((x + y + timeOffset * 10) % sandCharacters.length);
                            const character = sandCharacters[charIndex];

                            const noiseX = Math.sin(y * 0.1 + timeOffset) * chaosFactor;
                            const noiseY = Math.cos(x * 0.1 + timeOffset) * chaosFactor;

                            const alpha = 1 - (brightness / 180);
                            ctx.fillStyle = `rgba(30, 25, 15, ${alpha + 0.3})`;

                            ctx.fillText(character, x + noiseX, y + noiseY);
                        }
                    }
                }
            }
            requestAnimationFrame(renderSand);
        }
    </script>
</body>

</html>
