<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Areia - Hovering Semântico</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0908;
            color: #2c2519;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #book-cover {
            position: absolute;
            z-index: 10;
            width: 400px;
            height: 550px;
            background-image: url('capa.png');
            background-size: cover;
            background-position: center;
            border-radius: 5px 20px 20px 5px;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.8), inset 5px 0 20px rgba(0, 0, 0, 0.5);
            border-left: 15px solid #2a1f18;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1), opacity 2s ease, filter 2s ease;
        }

        body.is-dissolving #book-cover {
            transform: scale(1.1) rotate(3deg) translateY(-20px);
            opacity: 0;
            filter: url(#sand-dissolve) blur(10px) contrast(150%);
            pointer-events: none;
        }

        #codex-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            perspective: 2500px;
            transition: opacity 2s ease;
        }

        body.is-open #codex-container {
            opacity: 1;
            pointer-events: auto;
        }

        #codex-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #e3dec6;
            border: 1px solid rgba(44, 37, 25, 0.2);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.6);
            display: grid;
            grid-template-columns: 1.5fr 2fr 1.2fr;
            padding: 3rem;
            gap: 2rem;
            box-sizing: border-box;
            transform-style: preserve-3d;
            transform-origin: center;
            align-items: center;
        }

        .turning-page {
            animation: turnPageAnim 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes turnPageAnim {
            0% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }

            45% {
                transform: rotateY(-90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            55% {
                transform: rotateY(90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
        }

        #main-text-block {
            font-family: 'Amiri', serif;
            color: #2c2519;
            font-size: 1rem;
            line-height: 1.7;
            text-align: justify;
            text-justify: inter-word;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1.5rem;
            background: rgba(44, 37, 25, 0.04);
            border-radius: 4px;
            border-left: 3px solid rgba(44, 37, 25, 0.3);
            overflow: hidden;
            box-sizing: border-box;
        }

        .marginalia-right {
            font-family: 'Amiri', serif;
            color: #2c2519;
            opacity: 0.85;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.5rem;
        }

        .side-block-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: justify;
            background: rgba(44, 37, 25, 0.02);
            padding: 1rem;
            border-radius: 3px;
            border-top: 3px solid rgba(44, 37, 25, 0.3);
            height: 55%;
            overflow: hidden;
        }

        .side-block-diagonal {
            font-size: 0.85rem;
            line-height: 1.4;
            text-align: left;
            background: rgba(44, 37, 25, 0.05);
            padding: 1rem;
            border-radius: 2px;
            transform: rotate(-2deg);
            border-left: 2px solid rgba(44, 37, 25, 0.4);
            height: 35%;
            overflow: hidden;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.05);
        }

        .glyph-large {
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 0.7;
        }

        .glyph-rotated {
            display: inline-block;
            transform: rotate(-15deg);
        }

        .glyph-dropcap {
            float: left;
            font-size: 3.5rem;
            line-height: 0.6;
            padding-right: 8px;
            font-family: 'Cinzel', serif;
        }

        #sand-canvas {
            width: 100%;
            height: 85%;
            object-fit: cover;
            filter: url(#sand-distortion) contrast(1.1) sepia(0.5) brightness(0.9) blur(0.5px);
            border-radius: 8px;
        }

        #webcam-video {
            display: none;
        }
    </style>
</head>

<body>

    <svg style="display: none;">
        <filter id="sand-dissolve">
            <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="4" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="sand-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" id="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"
                id="displacement" />
        </filter>
    </svg>

    <div id="book-cover"></div>

    <div id="codex-container">
        <div id="codex-page">
            <div id="main-text-block">
                <div id="content-text">Invocando os versos da biblioteca...</div>
            </div>

            <div
                style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;">
                <canvas id="sand-canvas"></canvas>
            </div>

            <div class="marginalia-right">
                <div class="side-block-vertical" id="side-block-1"></div>
                <div class="side-block-diagonal" id="side-block-2"></div>
            </div>
        </div>
    </div>

    <video id="webcam-video" autoplay playsinline></video>

    <script>
        const bookCover = document.getElementById('book-cover');
        const codexPage = document.getElementById('codex-page');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width, height;
        let sandCharacters = "O LIVRO DE AREIA SE DESDOBRA. ";
        let timeOffset = 0;

        const step = 14;
        let isTurning = false;
        let isDissolving = false;

        let webImage = new Image();
        webImage.crossOrigin = "Anonymous";
        let isImageLoaded = false;

        const fallbackTexts = [
            "A poesia não começa em versos medidos, mas na areia movediça que consome os dias e apaga os rastros do espelho.",
            "As palavras deste livro desdobram-se como raízes noturnas, buscando o eco de um verso esquecido na biblioteca.",
            "O tempo constrói torres de silêncio e as desmorona em grãos finos que escorrem entre os dedos do leitor insone.",
            "Canta o labirinto invisível onde o caçador e a fera trocam de lugar sob a luz fria de astros mortos.",
            "De todas as obras do homem, nenhuma me pareceu tão vertiginosa quanto a invenção de bibliotecas onde os livros sangram areia."
        ];

        function resize() {
            if (!canvas.parentElement) return;
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        document.addEventListener('click', () => {
            if (!document.body.classList.contains('is-open')) {
                if (!isDissolving) {
                    isDissolving = true;
                    document.body.classList.add('is-dissolving');

                    setTimeout(() => {
                        bookCover.style.display = 'none';
                        document.body.classList.add('is-open');
                        initCamera();
                        updatePageContent();
                        setTimeout(renderSand, 2500);
                        isDissolving = false;
                    }, 1800);
                }
                return;
            }

            if (isTurning) return;
            turnPage();
        });

        function turnPage() {
            isTurning = true;
            codexPage.classList.add('turning-page');

            document.getElementById('turbulence').setAttribute('baseFrequency', '0.06');
            document.getElementById('displacement').setAttribute('scale', '15');

            setTimeout(() => {
                updatePageContent();
            }, 1500);

            setTimeout(() => {
                codexPage.classList.remove('turning-page');
                document.getElementById('turbulence').setAttribute('baseFrequency', '0.04');
                document.getElementById('displacement').setAttribute('scale', '8');
                isTurning = false;
            }, 3000);
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Erro na câmera: ", err);
            }
        }

        function generateTruncatedTypography(text, useDropCap = false) {
            let result = '';
            const glifosExtras = " ℵ ℞ منْهُ أَنْ ~ § · × ÷ ";

            if (useDropCap && text.length > 0) {
                result += `<span class="glyph-dropcap">${text[0]}</span>`;
                text = text.substring(1);
            }

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                const rand = Math.random();

                if (rand > 0.94) {
                    result += `<span class="glyph-large">${char}</span>`;
                } else if (rand > 0.88) {
                    result += `<span class="glyph-rotated">${char}</span>`;
                } else if (rand > 0.83) {
                    const glifeAleatorio = glifosExtras[Math.floor(Math.random() * glifosExtras.length)];
                    result += `<span style="font-family:'Amiri'; opacity:0.6;">${glifeAleatorio}</span>${char}`;
                } else {
                    result += char;
                }
            }
            return result;
        }

        async function fetchRandomBooks() {
            const termosBusca = ["poesia", "tempo", "labirinto", "espelho", "esquecimento", "areia", "universo"];
            const termo = termosBusca[Math.floor(Math.random() * termosBusca.length)];
            const startIndex = Math.floor(Math.random() * 40);

            try {
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${termo}&startIndex=${startIndex}&maxResults=4&langRestrict=pt`);
                const data = await response.json();

                let excerpts = [];
                if (data.items) {
                    for (let item of data.items) {
                        let text = item.searchInfo?.textSnippet || item.volumeInfo?.description || "";
                        text = text.replace(/(<([^>]+)>)/gi, "").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\s+/g, ' ').trim();
                        if (text.length > 20) {
                            excerpts.push(text);
                        }
                    }
                }

                while (excerpts.length < 4) {
                    excerpts.push(fallbackTexts[Math.floor(Math.random() * fallbackTexts.length)]);
                }
                return excerpts;
            } catch (err) {
                return [fallbackTexts[0], fallbackTexts[1], fallbackTexts[2], fallbackTexts[3]];
            }
        }

        async function updatePageContent() {
            document.getElementById('content-text').innerHTML = "<span class='glyph-dropcap'>...</span>Decifrando as poeiras do tempo...";
            document.getElementById('side-block-1').innerHTML = "";
            document.getElementById('side-block-2').innerHTML = "";

            const trechos = await fetchRandomBooks();

            const textoPrincipal = trechos[0];
            const textoLateral1 = trechos[1];
            const textoLateral2 = trechos[2];
            const textoWebcam = trechos[3];

            sandCharacters = textoWebcam.toUpperCase() + " • ";

            document.getElementById('content-text').innerHTML = generateTruncatedTypography(textoPrincipal, true);
            document.getElementById('side-block-1').innerHTML = generateTruncatedTypography(textoLateral1, false);
            document.getElementById('side-block-2').innerHTML = generateTruncatedTypography(textoLateral2, false);

            isImageLoaded = false;
            webImage.src = `https://picsum.photos/${Math.floor(width)}/${Math.floor(height)}?random=${Date.now()}&grayscale`;
            webImage.onload = () => {
                isImageLoaded = true;
            };
        }

        function renderSand() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.clearRect(0, 0, width, height);

                if (isImageLoaded) {
                    ctx.globalAlpha = 0.2;
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(webImage, 0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                tempCtx.translate(width, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, width, height);

                const imageData = tempCtx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                ctx.font = "14px Amiri";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // Variável de tempo para coordenar a flutuação sem deslocar o texto da grade
                timeOffset += 0.03;

                const cols = Math.floor(width / step);

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const index = (y * width + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];

                        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                        if (brightness > 90) {
                            const col = Math.floor(x / step);
                            const row = Math.floor(y / step);

                            // Posição na string é perfeitamente estática em relação à grade
                            let linearGridIndex = Math.floor(row * cols + col);

                            let charIndex = linearGridIndex % sandCharacters.length;
                            const character = sandCharacters[charIndex];

                            // Efeito Hovering: as letras flutuam suavemente no próprio eixo
                            const hoverX = Math.sin(timeOffset * 1.2 + y * 0.1) * 1.5;
                            const hoverY = Math.cos(timeOffset * 1.5 + x * 0.1) * 1.5;

                            const alpha = Math.min(0.9, (brightness - 90) / 165);
                            ctx.fillStyle = `rgba(44, 37, 25, ${alpha})`;

                            // Desenha com o offset local de flutuação
                            ctx.fillText(character, x + hoverX, y + hoverY);
                        }
                    }
                }
            }
            requestAnimationFrame(renderSand);
        }
    </script>
</body>

</html>
