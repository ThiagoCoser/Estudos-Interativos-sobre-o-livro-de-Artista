<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Areia - Composição Variável</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0908;
            color: #2c2519;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #book-cover {
            position: absolute;
            z-index: 10;
            width: 400px;
            height: 550px;
            transition: opacity 2.5s ease, transform 3s cubic-bezier(0.25, 1, 0.5, 1);
            background-image: url('capa.png');
            background-size: cover;
            background-position: center;
            border-radius: 5px 20px 20px 5px;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.8), inset 5px 0 20px rgba(0, 0, 0, 0.5);
            border-left: 15px solid #2a1f18;
        }

        #codex-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            perspective: 2500px;
            transition: opacity 3s ease 1.5s;
        }

        body.is-open #book-cover {
            opacity: 0;
            transform: scale(1.1) rotateY(-110deg);
        }

        body.is-open #codex-container {
            opacity: 1;
            pointer-events: auto;
        }

        /* O Códice com Grid flexível para permitir mutações de layout */
        #codex-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #e3dec6;
            border: 1px solid rgba(44, 37, 25, 0.2);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.6);
            display: grid;
            grid-template-columns: 1.2fr 2.6fr 1.2fr;
            padding: 2.5rem;
            gap: 1.5rem;
            box-sizing: border-box;
            transform-style: preserve-3d;
            transform-origin: center;
        }

        .turning-page {
            animation: turnPageAnim 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes turnPageAnim {
            0% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }

            45% {
                transform: rotateY(-90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            55% {
                transform: rotateY(90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
        }

        .marginalia {
            font-family: 'Amiri', serif;
            color: #2c2519;
            opacity: 0.85;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 5px;
        }

        /* Variações de Composição dos Blocos */
        .layout-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 1.05rem;
            line-height: 1.5;
            text-align: justify;
        }

        .layout-horizontal {
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: justify;
        }

        .layout-scattered {
            font-size: 0.85rem;
            line-height: 1.2;
            letter-spacing: 1px;
            text-align: right;
            transform: skewX(-5deg);
        }

        /* Glifos Expressivos Dinâmicos */
        .glyph-large {
            font-size: 2.2rem;
            font-weight: bold;
            line-height: 0.7;
            margin: 0 3px;
            color: #1a1610;
        }

        .glyph-rotated {
            display: inline-block;
            transform: rotate(-25deg);
        }

        .glyph-upside {
            display: inline-block;
            transform: scale(-1, -1);
        }

        .glyph-dropcap {
            float: left;
            font-size: 3.8rem;
            line-height: 0.7;
            padding-right: 8px;
            font-family: 'Cinzel', serif;
        }

        #sand-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: url(#sand-distortion) contrast(1.1) sepia(0.5) brightness(0.9) blur(0.5px);
            border-radius: 10px;
        }

        #webcam-video {
            display: none;
        }
    </style>
</head>

<body>

    <svg style="display: none;">
        <filter id="sand-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" id="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"
                id="displacement" />
        </filter>
    </svg>

    <div id="book-cover"></div>

    <div id="codex-container">
        <div id="codex-page">
            <!-- Margem Esquerda com múltiplos blocos dinâmicos -->
            <div class="marginalia" id="margin-left">
                <div id="left-block-1"></div>
                <div id="left-block-2"></div>
                <div id="left-block-3"></div>
            </div>

            <canvas id="sand-canvas"></canvas>

            <!-- Margem Direita com múltiplos blocos dinâmicos -->
            <div class="marginalia" id="margin-right">
                <div id="right-block-1"></div>
                <div id="right-block-2"></div>
                <div id="right-block-3"></div>
            </div>
        </div>
    </div>

    <video id="webcam-video" autoplay playsinline></video>

    <script>
        const codexPage = document.getElementById('codex-page');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width, height;
        let sandCharacters = "مِنْهُأَنْيَكُونَأَوْلَكِنَّهُمَكَانَ";
        let timeOffset = 0;

        const step = 14;
        let chaosFactor = 1.5;
        let isTurning = false;

        let webImage = new Image();
        webImage.crossOrigin = "Anonymous";
        let isImageLoaded = false;

        const bibliotecaBorgiana = [
            "O compêndio é monstruoso. Nenhuma página é a primeira; nenhuma é a última, pois o livro não tem princípio nem fim.",
            "Esta mancha de tinta nas margens oculta o mapa secreto de um império que já desabou na poeira do tempo.",
            "O espelho e a cópula são abomináveis, porque multiplicam o número e o reflexo visível dos homens no abismo.",
            "Vi a alta noite que não alenta a aurora, vi labirintos intricados na areia e o centro de todas as coisas.",
            "Ninguém é a pátria. Nem o cavaleiro que cruza a fronte, nem a tumba de pedra cinzenta sob a lua.",
            "O tempo é a substância de que sou feito. O tempo é um rio que me arrebasta, mas eu sou o rio.",
            "Creio que os sóis e as estrelas giram no vazio à procura de um nome perdido na memória dos deuses.",
            "De todas as obras do homem, nenhuma me pareceu tão vertiginosa quanto a invenção de bibliotecas infinitas.",
            "Encontrei o exemplar no fundo de uma gaveta escura; suas páginas exalavam um odor de deserto e de eras.",
            "Tudo foi escrito pelos séculos, e nós somos apenas os ecos passageiros de uma voz que nunca cala.",
            "O labirinto de Creta era simples de mais; este códice digital não tem paredes, apenas caminhos que se bifurcam.",
            "As letras árabes multiplicam-se como grãos de areia sob o vento invisível que sopra de leste a oeste."
        ];

        function resize() {
            if (!canvas.parentElement) return;
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        document.body.addEventListener('click', () => {
            if (!document.body.classList.contains('is-open')) {
                document.body.classList.add('is-open');
                initCamera();
                updatePageContent();
                setTimeout(renderSand, 2500);
                return;
            }

            if (isTurning) return;
            turnPage();
        });

        function turnPage() {
            isTurning = true;
            codexPage.classList.add('turning-page');

            chaosFactor = 15;
            document.getElementById('turbulence').setAttribute('baseFrequency', '0.06');
            document.getElementById('displacement').setAttribute('scale', '15');

            setTimeout(() => {
                updatePageContent();
            }, 1500);

            setTimeout(() => {
                codexPage.classList.remove('turning-page');
                chaosFactor = 1.5;
                document.getElementById('turbulence').setAttribute('baseFrequency', '0.04');
                document.getElementById('displacement').setAttribute('scale', '8');
                isTurning = false;
            }, 3000);
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Erro na câmera: ", err);
            }
        }

        // Gera glifos expressivos com mutações estocásticas
        function generateExpressiveTypography(text, useDropCap = false) {
            let result = '';
            if (useDropCap && text.length > 0) {
                result += `<span class="glyph-dropcap">${text[0]}</span>`;
                text = text.substring(1);
            }

            for (let i = 0; i < text.length; i++) {
                const rand = Math.random();
                if (rand > 0.96) {
                    result += `<span class="glyph-large">${text[i]}</span>`;
                } else if (rand > 0.92) {
                    result += `<span class="glyph-rotated">${text[i]}</span>`;
                } else if (rand > 0.88) {
                    result += `<span class="glyph-upside">${text[i]}</span>`;
                } else {
                    result += text[i];
                }
            }
            return result;
        }

        // Função de Composição Variável (Muda os layouts de posição e estrutura a cada página)
        function updatePageContent() {
            const fragmentoFinal = bibliotecaBorgiana[Math.floor(Math.random() * bibliotecaBorgiana.length)];
            sandCharacters = fragmentoFinal.replace(/\s+/g, '').toUpperCase() + "مِنْهُأَنْيَكُونَ∞";

            const blocosIds = ['left-block-1', 'left-block-2', 'left-block-3', 'right-block-1', 'right-block-2', 'right-block-3'];
            const possiveisClasses = ['layout-vertical', 'layout-horizontal', 'layout-scattered'];

            // Pedaços do texto distribuídos aleatoriamente pelos 6 blocos
            const tamanhoPedaço = Math.max(10, Math.floor(fragmentoFinal.length / 6));

            blocosIds.forEach((id, index) => {
                const elemento = document.getElementById(id);

                // Sorteia um layout visual diferente para cada bloco a cada virada de página
                elemento.className = possiveisClasses[Math.floor(Math.random() * possiveisClasses.length)];

                // Pega um trecho do texto
                const inicio = index * tamanhoPedaço;
                const fim = inicio + tamanhoPedaço;
                const pedaço = fragmentoFinal.substring(inicio, fim) || fragmentoFinal.substring(0, 20);

                // Aplica a tipografia expressiva (com letra capitular apenas no primeiro bloco)
                elemento.innerHTML = generateExpressiveTypography(pedaço, index === 0);
            });

            // Atualiza a imagem de fundo
            isImageLoaded = false;
            webImage.src = `https://picsum.photos/${Math.floor(width)}/${Math.floor(height)}?random=${Date.now()}&grayscale`;
            webImage.onload = () => {
                isImageLoaded = true;
            };
        }

        function renderSand() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.clearRect(0, 0, width, height);

                if (isImageLoaded) {
                    ctx.globalAlpha = 0.2;
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(webImage, 0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                tempCtx.translate(width, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, width, height);

                const imageData = tempCtx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                ctx.font = "14px Amiri";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                timeOffset += 0.05;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const index = (y * width + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];

                        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                        if (brightness < 180) {
                            const charIndex = Math.floor((x + y + timeOffset * 10) % sandCharacters.length);
                            const character = sandCharacters[charIndex];

                            const noiseX = Math.sin(y * 0.1 + timeOffset) * chaosFactor;
                            const noiseY = Math.cos(x * 0.1 + timeOffset) * chaosFactor;

                            const alpha = 1 - (brightness / 180);
                            ctx.fillStyle = `rgba(30, 25, 15, ${alpha + 0.3})`;

                            ctx.fillText(character, x + noiseX, y + noiseY);
                        }
                    }
                }
            }
            requestAnimationFrame(renderSand);
        }
    </script>
</body>

</html>
