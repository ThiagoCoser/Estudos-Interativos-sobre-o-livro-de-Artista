<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Areia - Infinito</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1814;
            /* Escuro para a capa */
            color: #2c2519;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 2s ease;
        }

        /* ESTADO 1: A Capa do Livro */
        #book-cover {
            position: absolute;
            z-index: 10;
            text-align: center;
            color: #d4cfb6;
            cursor: pointer;
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        #book-cover h1 {
            font-size: 3rem;
            letter-spacing: 0.2rem;
            margin-bottom: 0.5rem;
        }

        #book-cover p {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            opacity: 0.7;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* ESTADO 2: O Códice Aberto */
        #codex-page {
            position: relative;
            width: 90vw;
            height: 90vh;
            background-color: #e3dec6;
            border: 2px solid rgba(44, 37, 25, 0.1);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.1), 0 0 50px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            padding: 2rem;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease 0.5s;
        }

        /* Quando o livro abre, mudamos as classes no body */
        body.is-open {
            background-color: #000;
        }

        body.is-open #book-cover {
            opacity: 0;
            transform: scale(1.5);
            pointer-events: none;
        }

        body.is-open #codex-page {
            opacity: 1;
            pointer-events: auto;
        }

        /* Elementos da Diagramação Voynich */
        .marginalia {
            font-family: 'Amiri', serif;
            font-size: 1.2rem;
            line-height: 1.8;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            opacity: 0.6;
            word-wrap: break-word;
            overflow: hidden;
            text-align: justify;
        }

        #sand-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Filtros para dar textura de manuscrito sobre a imagem */
            filter: contrast(1.1) sepia(0.4) brightness(0.9);
        }

        #webcam-video {
            display: none;
        }
    </style>
</head>

<body>

    <!-- A Capa -->
    <div id="book-cover">
        <h1>O Livro de Areia</h1>
        <p>Tocar para abrir</p>
    </div>

    <!-- O Miolo -->
    <div id="codex-page">
        <div class="marginalia" id="margin-left"></div>
        <canvas id="sand-canvas"></canvas>
        <div class="marginalia" id="margin-right"></div>
    </div>

    <video id="webcam-video" autoplay playsinline></video>

    <script>
        const cover = document.getElementById('book-cover');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width, height;
        let sandCharacters = "مِنْهُأَنْيَكُونَأَوْلَكِنَّهُمَكَانَ";
        let timeOffset = 0;
        const step = 14;

        // Imagem externa (Internet Feed)
        let webImage = new Image();
        webImage.crossOrigin = "Anonymous"; // Essencial para manipular imagens externas no Canvas
        let isImageLoaded = false;

        function resize() {
            if (!canvas.parentElement) return;
            width = canvas.parentElement.clientWidth / 2;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- LÓGICA DE INTERAÇÃO (ABRIR O LIVRO) ---
        cover.addEventListener('click', () => {
            document.body.classList.add('is-open');
            initCamera();
            fetchLiveDust();
            fetchWebImage(); // Busca a primeira imagem
            setTimeout(renderSand, 1000); // Aguarda a transição CSS para iniciar o render
        });

        // --- SISTEMAS DE DADOS EXTERNOS ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Erro na câmera: ", err);
            }
        }

        async function fetchLiveDust() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/' + Math.floor(Math.random() * 100 + 1));
                const data = await response.json();
                let rawText = data.body.replace(/\s+/g, '').toUpperCase();
                sandCharacters = rawText + "مِنْهُأَنْيَكُونَ";

                document.getElementById('margin-left').innerText = sandCharacters.substring(0, 150);
                document.getElementById('margin-right').innerText = sandCharacters.substring(150, 300);
            } catch (err) {
                console.log("Erro ao buscar texto.");
            }
        }

        // Busca uma imagem aleatória da internet (Picsum simula um feed contínuo)
        function fetchWebImage() {
            isImageLoaded = false;
            // O parâmetro time força o navegador a baixar uma nova imagem e não usar o cache
            webImage.src = `https://picsum.photos/${Math.floor(width)}/${Math.floor(height)}?random=${new Date().getTime()}`;
            webImage.onload = () => {
                isImageLoaded = true;
            };
        }

        // Renova os textos e as imagens ciclicamente (a cada 7 segundos)
        setInterval(() => {
            if (document.body.classList.contains('is-open')) {
                fetchLiveDust();
                fetchWebImage();
            }
        }, 7000);

        // --- O MOTOR GRÁFICO (O PALIMPSESTO) ---
        function renderSand() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {

                // 1. Limpa o canvas e prepara o fundo
                ctx.clearRect(0, 0, width, height);

                // 2. Desenha a imagem da internet no fundo (como uma memória apagada)
                if (isImageLoaded) {
                    ctx.globalAlpha = 0.3; // Deixa a imagem espectral
                    // Blend mode para misturar a imagem externa com o tom de papel
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(webImage, 0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over'; // Reseta para o texto
                    ctx.globalAlpha = 1.0;
                }

                // 3. Processa a Webcam num canvas invisível
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                // Espelha a câmera
                tempCtx.translate(width, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, width, height);

                const imageData = tempCtx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                ctx.font = "12px Amiri";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                timeOffset += 0.05;

                // 4. Desenha a "Areia" (Os caracteres mapeados no seu rosto)
                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const index = (y * width + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];

                        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                        // Onde a câmera vê "escuro", desenhamos o texto
                        if (brightness < 180) {
                            const charIndex = Math.floor((x + y + timeOffset * 10) % sandCharacters.length);
                            const character = sandCharacters[charIndex];

                            const noiseX = Math.sin(y * 0.1 + timeOffset) * 1.5;
                            const noiseY = Math.cos(x * 0.1 + timeOffset) * 1.5;

                            // A cor da areia reage à imagem externa e à escuridão da câmera
                            const alpha = 1 - (brightness / 180);
                            ctx.fillStyle = `rgba(30, 25, 15, ${alpha + 0.2})`;

                            ctx.fillText(character, x + noiseX, y + noiseY);
                        }
                    }
                }
            }
            requestAnimationFrame(renderSand);
        }
    </script>
</body>

</html>
