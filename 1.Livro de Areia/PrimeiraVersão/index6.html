<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Livro de Areia - Diagramação Voynich</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0908;
            color: #2c2519;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* A Capa */
        #book-cover {
            position: absolute;
            z-index: 10;
            width: 400px;
            height: 550px;
            transition: opacity 2.5s ease, transform 3s cubic-bezier(0.25, 1, 0.5, 1);
            background-image: url('capa.png');
            background-size: cover;
            background-position: center;
            border-radius: 5px 20px 20px 5px;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.8), inset 5px 0 20px rgba(0, 0, 0, 0.5);
            border-left: 15px solid #2a1f18;
        }

        /* O Códice Aberto */
        #codex-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            perspective: 2500px;
            transition: opacity 3s ease 1.5s;
        }

        body.is-open #book-cover {
            opacity: 0;
            transform: scale(1.1) rotateY(-110deg);
        }

        body.is-open #codex-container {
            opacity: 1;
            pointer-events: auto;
        }

        #codex-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #e3dec6;
            border: 1px solid rgba(44, 37, 25, 0.2);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.1), 0 10px 30px rgba(0, 0, 0, 0.6);

            /* Novo Grid: Mais espaço para a diagramação expressiva nas laterais */
            display: grid;
            grid-template-columns: 1.5fr 2fr 1.5fr;
            padding: 3rem;
            gap: 2rem;
            box-sizing: border-box;
            transform-style: preserve-3d;
            transform-origin: center;
        }

        .turning-page {
            animation: turnPageAnim 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes turnPageAnim {
            0% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }

            45% {
                transform: rotateY(-90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            55% {
                transform: rotateY(90deg) scale(0.95);
                opacity: 0;
                filter: blur(10px);
            }

            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
        }

        /* DIAGRAMAÇÃO ESTÁTICA EXPRESSIVA (Estilo Voynich / Borges) */
        .marginalia {
            font-family: 'Amiri', serif;
            color: #2c2519;
            opacity: 0.7;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .text-block-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 1.2rem;
            line-height: 1.5;
            text-align: justify;
            max-height: 40%;
            overflow: hidden;
        }

        .text-block-chaotic {
            font-size: 1rem;
            line-height: 1.2;
            text-align: right;
            word-wrap: break-word;
        }

        /* Classes injetadas via JS para quebrar o grid tipográfico */
        .glyph-large {
            font-size: 2.2rem;
            font-weight: bold;
            line-height: 0.8;
            margin: 0 5px;
            color: #1a1610;
        }

        .glyph-rotated {
            display: inline-block;
            transform: rotate(-15deg);
        }

        .glyph-dropcap {
            float: left;
            font-size: 4rem;
            line-height: 0.8;
            padding-right: 10px;
        }

        #sand-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: url(#sand-distortion) contrast(1.1) sepia(0.5) brightness(0.9) blur(0.5px);
            border-radius: 10px;
        }

        #webcam-video {
            display: none;
        }
    </style>
</head>

<body>

    <svg style="display: none;">
        <filter id="sand-distortion">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" id="turbulence" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"
                id="displacement" />
        </filter>
    </svg>

    <div id="book-cover"></div>

    <div id="codex-container">
        <div id="codex-page">
            <!-- Margem Esquerda: Múltiplos blocos para layout orgânico -->
            <div class="marginalia" id="margin-left">
                <div class="text-block-chaotic" id="left-block-1"></div>
                <div class="text-block-vertical" id="left-block-2"></div>
            </div>

            <canvas id="sand-canvas"></canvas>

            <!-- Margem Direita: Múltiplos blocos -->
            <div class="marginalia" id="margin-right">
                <div class="text-block-vertical" id="right-block-1"></div>
                <div class="text-block-chaotic" id="right-block-2" style="text-align: left;"></div>
            </div>
        </div>
    </div>

    <video id="webcam-video" autoplay playsinline></video>

    <script>
        const codexPage = document.getElementById('codex-page');
        const video = document.getElementById('webcam-video');
        const canvas = document.getElementById('sand-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let width, height;
        let sandCharacters = "مِنْهُأَنْيَكُونَأَوْلَكِنَّهُمَكَانَ";
        let timeOffset = 0;

        // Mantendo a densidade e as cores originais da webcam
        const step = 14;
        let chaosFactor = 1.5;
        let isTurning = false;

        let webImage = new Image();
        webImage.crossOrigin = "Anonymous";
        let isImageLoaded = false;

        function resize() {
            if (!canvas.parentElement) return;
            width = canvas.parentElement.clientWidth;
            height = canvas.parentElement.clientHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. Interação de Abertura e Virada
        document.body.addEventListener('click', () => {
            if (!document.body.classList.contains('is-open')) {
                document.body.classList.add('is-open');
                initCamera();
                fetchLiveDust();
                fetchWebImage();
                setTimeout(renderSand, 2500);
                return;
            }

            if (isTurning) return;
            turnPage();
        });

        function turnPage() {
            isTurning = true;
            codexPage.classList.add('turning-page');

            chaosFactor = 15;
            document.getElementById('turbulence').setAttribute('baseFrequency', '0.06');
            document.getElementById('displacement').setAttribute('scale', '15');

            setTimeout(() => {
                fetchLiveDust();
                fetchWebImage();
            }, 1500);

            setTimeout(() => {
                codexPage.classList.remove('turning-page');
                chaosFactor = 1.5;
                document.getElementById('turbulence').setAttribute('baseFrequency', '0.04');
                document.getElementById('displacement').setAttribute('scale', '8');
                isTurning = false;
            }, 3000);
        }

        // 2. Câmera e Dados
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Erro na câmera: ", err);
            }
        }

        // 3. Processamento Estático Expressivo (O HTML)
        function generateExpressiveTypography(text, useDropCap = false) {
            let result = '';
            if (useDropCap && text.length > 0) {
                result += `<span class="glyph-dropcap">${text[0]}</span>`;
                text = text.substring(1);
            }

            for (let i = 0; i < text.length; i++) {
                // Injeta aleatoriamente classes CSS para quebrar a uniformidade do texto
                const rand = Math.random();
                if (rand > 0.95) {
                    result += `<span class="glyph-large">${text[i]}</span>`;
                } else if (rand > 0.90) {
                    result += `<span class="glyph-rotated">${text[i]}</span>`;
                } else {
                    result += text[i];
                }
            }
            return result;
        }

        async function fetchLiveDust() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/' + Math.floor(Math.random() * 100 + 1));
                const data = await response.json();
                let rawText = data.body.replace(/\s+/g, '').toUpperCase();
                sandCharacters = rawText + "مِنْهُأَنْيَكُونَ∞";

                // Popula os blocos estáticos com a diagramação expressiva gerada pelo JS
                document.getElementById('left-block-1').innerHTML = generateExpressiveTypography(sandCharacters.substring(0, 80), true);
                document.getElementById('left-block-2').innerHTML = generateExpressiveTypography(sandCharacters.substring(80, 150));

                document.getElementById('right-block-1').innerHTML = generateExpressiveTypography(sandCharacters.substring(150, 220));
                document.getElementById('right-block-2').innerHTML = generateExpressiveTypography(sandCharacters.substring(220, 300), true);
            } catch (err) {
                console.log("Mantendo texto base.");
            }
        }

        function fetchWebImage() {
            isImageLoaded = false;
            webImage.src = `https://picsum.photos/${Math.floor(width)}/${Math.floor(height)}?random=${new Date().getTime()}&grayscale`;
            webImage.onload = () => {
                isImageLoaded = true;
            };
        }

        // 4. O Motor Gráfico (Retornado à estabilidade e cor original)
        function renderSand() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.clearRect(0, 0, width, height);

                // Imagem de fundo etérea
                if (isImageLoaded) {
                    ctx.globalAlpha = 0.15;
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.drawImage(webImage, 0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                }

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = width;
                tempCanvas.height = height;
                const tempCtx = tempCanvas.getContext('2d');

                tempCtx.translate(width, 0);
                tempCtx.scale(-1, 1);
                tempCtx.drawImage(video, 0, 0, width, height);

                const imageData = tempCtx.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                // Restauração da tipografia uniforme e estática para a malha da webcam
                ctx.font = "14px Amiri";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                timeOffset += 0.05;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const index = (y * width + x) * 4;
                        const r = pixels[index];
                        const g = pixels[index + 1];
                        const b = pixels[index + 2];

                        const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                        if (brightness < 180) {
                            const charIndex = Math.floor((x + y + timeOffset * 10) % sandCharacters.length);
                            const character = sandCharacters[charIndex];

                            const noiseX = Math.sin(y * 0.1 + timeOffset) * chaosFactor;
                            const noiseY = Math.cos(x * 0.1 + timeOffset) * chaosFactor;

                            // Mantém a paleta de tons sépia originais
                            const alpha = 1 - (brightness / 180);
                            ctx.fillStyle = `rgba(30, 25, 15, ${alpha + 0.3})`;

                            ctx.fillText(character, x + noiseX, y + noiseY);
                        }
                    }
                }
            }
            requestAnimationFrame(renderSand);
        }
    </script>
</body>

</html>
